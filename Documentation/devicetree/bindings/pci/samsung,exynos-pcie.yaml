%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/samsung,exynos-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung SoC series PCIe Host Controller

maintainers:
  - Marek Szyprowski <m.szyprowski@samsung.com>
  - Jaehoon Chung <jh80.chung@samsung.com>

description: |+
  Samsung Exynos PCIe host controllers are based on the Synopsys DesignWare
  PCIe IP and inherit all common properties defined in snps,dw-pcie.yaml.

allOf:
  - $ref: /schemas/pci/snps,dw-pcie.yaml#

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos5433-pcie

    then:
      properties:
        reg:
          items:
            - description: Data Bus Interface (DBI) registers
            - description: External Local Bus interface (ELBI) registers
            - description: PCIe configuration space region

        reg-names:
          items:
            - const: dbi
            - const: elbi
            - const: config

        clocks:
          items:
            - description: PCIe bridge clock
            - description: PCIe bus clock

        clock-names:
          items:
            - const: pcie
            - const: pcie_bus

      required:
        - phys
        - vdd10-supply
        - vdd18-supply

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-pcie

    then:
      properties:
        reg:
          items:
            - description: Data Bus Interface (DBI) registers
            - description: External Local Bus interface (ELBI) registers
            - description: PCIe configuration space region
            - description: Integrated PHY PMA registers
            - description: Integrated PHY PCS registers
            - description: Internal automation registers

        reg-names:
          items:
            - const: dbi
            - const: elbi
            - const: config
            - const: phy
            - const: pcs
            - const: ia

        clocks:
          items:
            - description: PCIe PHY reference clock
            - description: PCIe DBI bus clock
            - description: PCIe PHY APB clock
            - description: PCIe master bus clock
            - description: PCIe sub-controller APB clock
            - description: PCIe PCS APB clock
            - description: PCIe slave bus clock

        clock-names:
          items:
            - const: phy_ref
            - const: dbi
            - const: phy_apb
            - const: mstr
            - const: subctrl
            - const: pcs
            - const: slv

        phys: false
        vdd10-supply: false
        vdd18-supply: false
        max-link-speed:
          const: 2

      required:
        - max-link-speed
        - reset-gpios
        - samsung,fsys-sysreg
        - samsung,pmu-syscon
        - vpcie3v3-supply

properties:
  compatible:
    enum:
      - samsung,exynos5433-pcie
      - samsung,exynos9810-pcie

  reg:
    minItems: 3
    maxItems: 6

  reg-names:
    minItems: 3
    maxItems: 6

  interrupts:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 7

  clock-names:
    minItems: 2
    maxItems: 7

  phys:
    maxItems: 1

  samsung,fsys-sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the FSYS1 system register controller used by the
      integrated PCIe PHY.

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the PMU system controller used to power the PCIe PHY.

  vdd10-supply:
    description:
      Phandle to a regulator that provides 1.0V power to the PCIe block.

  vdd18-supply:
    description:
      Phandle to a regulator that provides 1.8V power to the PCIe block.

  vpcie3v3-supply:
    description:
      Phandle to the regulator that controls power to the PCIe endpoint.

  num-lanes:
    const: 1

  num-viewport:
    const: 3

required:
  - reg
  - reg-names
  - interrupts
  - "#address-cells"
  - "#size-cells"
  - "#interrupt-cells"
  - interrupt-map
  - interrupt-map-mask
  - ranges
  - bus-range
  - device_type
  - num-lanes
  - num-viewport
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/exynos5433.h>

    pcie: pcie@15700000 {
        compatible = "samsung,exynos5433-pcie";
        reg = <0x15700000 0x1000>, <0x156b0000 0x1000>, <0x0c000000 0x1000>;
        reg-names = "dbi", "elbi", "config";
        #address-cells = <3>;
        #size-cells = <2>;
        #interrupt-cells = <1>;
        device_type = "pci";
        interrupts = <GIC_SPI 245 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cmu_fsys CLK_PCIE>, <&cmu_fsys CLK_PCLK_PCIE_PHY>;
        clock-names = "pcie", "pcie_bus";
        phys = <&pcie_phy>;
        pinctrl-0 = <&pcie_bus &pcie_wlanen>;
        pinctrl-names = "default";
        num-lanes = <1>;
        num-viewport = <3>;
        bus-range = <0x00 0xff>;
        ranges = <0x81000000 0 0	  0x0c001000 0 0x00010000>,
                 <0x82000000 0 0x0c011000 0x0c011000 0 0x03feefff>;
        vdd10-supply = <&ldo6_reg>;
        vdd18-supply = <&ldo7_reg>;
        interrupt-map-mask = <0 0 0 0>;
        interrupt-map = <0 0 0 0 &gic GIC_SPI 245 IRQ_TYPE_LEVEL_HIGH>;
    };
...
