%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/samsung/samsung,exynos9810-pmu-intr-gen.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos9810 PMU Interrupt Generator

description: |
  Interrupt handshake registers shared by the application processors and
  the ACPM firmware for CPU power-state transitions.

maintainers:
  - Mathias Gluszczynski <admin@krazey.de>

properties:
  compatible:
    items:
      - const: samsung,exynos9810-pmu-intr-gen
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    pmu_intr_gen: syscon@14070000 {
        compatible = "samsung,exynos9810-pmu-intr-gen", "syscon";
        reg = <0x14070000 0x1000>;
    };
...
