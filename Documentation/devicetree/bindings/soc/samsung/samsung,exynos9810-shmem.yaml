%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/samsung/samsung,exynos9810-shmem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos9810 firmware shared memory

maintainers:
  - Mathias Gluszczynski <admin@krazey.de>

description:
  The Exynos9810 modem reservation contains regions shared with the ABOX
  audio firmware. The layout provider exposes the voice-service firmware
  and parameter regions while retaining the stock physical boundaries.

properties:
  $nodename:
    const: shared-memory

  compatible:
    const: samsung,exynos9810-shmem

  memory-region:
    maxItems: 1
    description: Reserved modem memory containing the shared regions.

  samsung,cp-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0x7900000
    description: Size of the modem firmware area before the VSS region.

  samsung,vss-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0x700000
    description: Size of the ABOX voice-service firmware region.

  samsung,ipc-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0x8000000
    description: Offset of the modem IPC region in the reservation.

  samsung,ipc-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0x500000
    description: Size of the modem IPC region.

  samsung,zmb-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0x8500000
    description: Offset of the modem zero-copy buffer region.

  samsung,zmb-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0xb00000
    description: Size of the modem zero-copy buffer region.

  samsung,vparam-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0x200000
    description: Size of the voice-service parameter region.

required:
  - compatible
  - memory-region
  - samsung,cp-size
  - samsung,vss-size
  - samsung,ipc-offset
  - samsung,ipc-size
  - samsung,zmb-offset
  - samsung,zmb-size
  - samsung,vparam-size

additionalProperties: false

examples:
  - |
    reserved-memory {
        #address-cells = <2>;
        #size-cells = <1>;
        ranges;

        modem_memory: memory@f0000000 {
            reg = <0x0 0xf0000000 0x9200000>;
            no-map;
        };
    };

    shared-memory {
        compatible = "samsung,exynos9810-shmem";
        memory-region = <&modem_memory>;
        samsung,cp-size = <0x7900000>;
        samsung,vss-size = <0x700000>;
        samsung,ipc-offset = <0x8000000>;
        samsung,ipc-size = <0x500000>;
        samsung,zmb-offset = <0x8500000>;
        samsung,zmb-size = <0xb00000>;
        samsung,vparam-size = <0x200000>;
    };
...
