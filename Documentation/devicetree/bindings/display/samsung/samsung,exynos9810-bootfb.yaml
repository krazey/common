%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos9810-bootfb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos9810 preserved boot framebuffer

maintainers:
  - Mathias Gluszczynski <admin@krazey.de>

description: |
  Samsung's Exynos9810 bootloader leaves the internal display pipeline
  scanning out a reserved framebuffer. This binding describes that scanout
  while native DECON, DPP and DSIM support is unavailable. The register
  resource identifies the primary DECON instance and preserves the legacy
  platform-device name used by Android userspace.

properties:
  compatible:
    const: samsung,exynos9810-bootfb

  reg:
    maxItems: 1

  memory-region:
    maxItems: 1
    description: Reserved framebuffer scanned out by the bootloader.

  width:
    $ref: /schemas/types.yaml#/definitions/uint32

  height:
    $ref: /schemas/types.yaml#/definitions/uint32

  stride:
    $ref: /schemas/types.yaml#/definitions/uint32

  width-mm:
    $ref: /schemas/types.yaml#/definitions/uint32

  height-mm:
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - reg
  - memory-region
  - width
  - height
  - stride
  - width-mm
  - height-mm

additionalProperties: false

examples:
  - |
    / {
        #address-cells = <2>;
        #size-cells = <1>;

        reserved-memory {
            #address-cells = <2>;
            #size-cells = <1>;
            ranges;

            framebuffer: framebuffer@cc000000 {
                reg = <0x0 0xcc000000 0x01042800>;
                no-map;
            };
        };

        decon_f@16030000 {
            compatible = "samsung,exynos9810-bootfb";
            reg = <0x0 0x16030000 0x1000>;
            memory-region = <&framebuffer>;
            width = <1440>;
            height = <2960>;
            stride = <5760>;
            width-mm = <64>;
            height-mm = <132>;
        };
    };
...
