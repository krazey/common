%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos9810-bootfb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos9810 preserved boot framebuffer

maintainers:
  - Mathias Gluszczynski <admin@krazey.de>

description: |
  Samsung's Exynos9810 bootloader leaves the internal display pipeline
  scanning out a reserved framebuffer. This binding describes that scanout
  while native DECON, DPP and DSIM support is unavailable. The register
  resources identify the display blocks retained by the compatibility driver
  and preserve the legacy platform-device name used by Android userspace.

properties:
  compatible:
    const: samsung,exynos9810-bootfb

  reg:
    items:
      - description: Primary DECON registers
      - description: DPP G0 registers
      - description: IDMA G0 registers
      - description: Primary DSIM registers

  reg-names:
    items:
      - const: decon
      - const: dpp-g0
      - const: idma-g0
      - const: dsim

  interrupts:
    items:
      - description: IDMA G0 interrupt
      - description: DPP G0 interrupt

  interrupt-names:
    items:
      - const: idma-g0
      - const: dpp-g0

  iommus:
    maxItems: 1

  memory-region:
    maxItems: 1
    description: Reserved framebuffer scanned out by the bootloader.

  width:
    $ref: /schemas/types.yaml#/definitions/uint32

  height:
    $ref: /schemas/types.yaml#/definitions/uint32

  stride:
    $ref: /schemas/types.yaml#/definitions/uint32

  width-mm: true

  height-mm: true

required:
  - compatible
  - reg
  - reg-names
  - memory-region
  - width
  - height
  - stride
  - width-mm
  - height-mm

additionalProperties: false

examples:
  - |
    / {
        #address-cells = <2>;
        #size-cells = <1>;

        reserved-memory {
            #address-cells = <2>;
            #size-cells = <1>;
            ranges;

            framebuffer: framebuffer@cc000000 {
                reg = <0x0 0xcc000000 0x01042800>;
                no-map;
            };
        };

        decon_f@16030000 {
            compatible = "samsung,exynos9810-bootfb";
            reg = <0x0 0x16030000 0x1000>,
                  <0x0 0x16021000 0x1000>,
                  <0x0 0x16071000 0x1000>,
                  <0x0 0x16080000 0x0100>;
            reg-names = "decon", "dpp-g0", "idma-g0", "dsim";
            memory-region = <&framebuffer>;
            width = <1440>;
            height = <2960>;
            stride = <5760>;
            width-mm = <64>;
            height-mm = <132>;
        };
    };
...
