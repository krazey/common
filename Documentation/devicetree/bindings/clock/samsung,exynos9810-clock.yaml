%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/samsung,exynos9810-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos9810 SoC clock controller

maintainers:
  - Mathias Gluszczynski <admin@krazey.de>

description: |
  The Exynos9810 clock controller is split into multiple CMU blocks. Each CMU
  generates clocks for a separate hardware domain and is represented by an
  individual device tree node.

  The root clock is an external 26 MHz oscillator. Domain input clocks are
  generated by CMU_TOP and supplied to the leaf CMU nodes.

  Clock identifiers consumed by device nodes are defined in
  include/dt-bindings/clock/samsung,exynos9810.h.

properties:
  compatible:
    enum:
      - samsung,exynos9810-cmu-cmgp
      - samsung,exynos9810-cmu-dpu
      - samsung,exynos9810-cmu-fsys0
      - samsung,exynos9810-cmu-fsys1
      - samsung,exynos9810-cmu-peric0
      - samsung,exynos9810-cmu-top

  clocks:
    minItems: 2
    maxItems: 4

  clock-names:
    minItems: 2
    maxItems: 4

  "#clock-cells":
    const: 1

  reg:
    maxItems: 1

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-cmu-top

    then:
      properties:
        clocks:
          minItems: 2
          maxItems: 2
          items:
            - description: External reference clock
            - description: Bootstrap source for the CMGP bus clock

        clock-names:
          minItems: 2
          maxItems: 2
          items:
            - const: oscclk
            - const: cmgp_bus_bootclk

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-cmu-dpu

    then:
      properties:
        clocks:
          minItems: 2
          maxItems: 2
          items:
            - description: External reference clock
            - description: CMU_DPU bus clock from CMU_TOP

        clock-names:
          minItems: 2
          maxItems: 2
          items:
            - const: oscclk
            - const: dout_clkcmu_dpu_bus

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-cmu-fsys0

    then:
      properties:
        clocks:
          minItems: 4
          maxItems: 4
          items:
            - description: External reference clock
            - description: CMU_FSYS0 bus clock from CMU_TOP
            - description: Embedded UFS clock from CMU_TOP
            - description: USB DRD clock from CMU_TOP

        clock-names:
          minItems: 4
          maxItems: 4
          items:
            - const: oscclk
            - const: dout_clkcmu_fsys0_bus
            - const: dout_clkcmu_fsys0_ufs_embd
            - const: dout_clkcmu_fsys0_usb30drd

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-cmu-fsys1

    then:
      properties:
        clocks:
          minItems: 3
          maxItems: 3
          items:
            - description: External reference clock
            - description: CMU_FSYS1 bus clock from CMU_TOP
            - description: PCIe reference clock from CMU_TOP

        clock-names:
          minItems: 3
          maxItems: 3
          items:
            - const: oscclk
            - const: dout_clkcmu_fsys1_bus
            - const: dout_clkcmu_fsys1_pcie

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-cmu-peric0

    then:
      properties:
        clocks:
          minItems: 3
          maxItems: 3
          items:
            - description: External reference clock
            - description: CMU_PERIC0 bus clock from CMU_TOP
            - description: CMU_PERIC0 IP clock from CMU_TOP

        clock-names:
          minItems: 3
          maxItems: 3
          items:
            - const: oscclk
            - const: dout_clkcmu_peric0_bus
            - const: dout_clkcmu_peric0_ip

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-cmu-cmgp

    then:
      properties:
        clocks:
          minItems: 2
          maxItems: 2
          items:
            - description: External reference clock
            - description: CMU_CMGP bus clock from CMU_TOP

        clock-names:
          minItems: 2
          maxItems: 2
          items:
            - const: oscclk
            - const: dout_clkcmu_cmgp_bus

required:
  - compatible
  - "#clock-cells"
  - clocks
  - clock-names
  - reg

additionalProperties: false

examples:
  - |
    clock-controller@10400000 {
        compatible = "samsung,exynos9810-cmu-peric0";
        reg = <0x10400000 0x8000>;
        #clock-cells = <1>;

        clocks = <&oscclk>, <&peric0_bus>, <&peric0_ip>;
        clock-names = "oscclk", "dout_clkcmu_peric0_bus",
                      "dout_clkcmu_peric0_ip";
    };

...
